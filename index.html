<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Enrich Time Clock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef1ee;--ink:#172321;--mut:#5c6b68;--card:#fff;--line:#d3dbd8;--in:#10543a;--out:#3b4ba8;--bad:#a8321f}
@media(prefers-color-scheme:dark){:root{--bg:#121a19;--ink:#e8efec;--mut:#98a9a5;--card:#1b2625;--line:#2c3a38;--in:#4fb868;--out:#8c98ee;--bad:#f08b78}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
#kiosk{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:32px;max-width:1100px;margin:auto;align-items:center}
.clock{font-size:clamp(56px,9vw,104px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.date{color:var(--mut);font-size:20px;margin:6px 0 20px}
video{width:100%;max-width:420px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#000;transform:scaleX(-1)}
.hint{color:var(--mut);margin-top:10px}.hint.snap{color:var(--in);font-weight:700;font-size:28px}
.pad{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:380px;justify-self:center;width:100%}
.dots{display:flex;gap:14px;justify-content:center;height:28px;margin-bottom:16px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:72px;font-size:28px;border-radius:14px;border:1px solid var(--line);background:var(--bg);touch-action:manipulation}
.keys button:active{transform:scale(.96)}.io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.io button{height:76px;font-size:24px;font-weight:700;border:0;border-radius:14px;color:#fff;touch-action:manipulation}.io .in{background:var(--in)}.io .out{background:var(--out)}.io button:active{transform:scale(.96)}
#msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--in);color:#fff}
#msg.show{display:grid}#msg.in{background:var(--in)}#msg.out{background:var(--out)}#msg.bad{background:var(--bad)}
#msg h1{font-size:clamp(36px,7vw,72px);margin:0 0 8px}#msg p{font-size:28px;margin:0}
@media(max-width:760px){#kiosk{grid-template-columns:1fr;padding:16px}}
.brand{display:inline-block;background:#fff;border-radius:14px;padding:8px 16px;margin-bottom:18px}.brand img{display:block;height:56px;width:auto}
[hidden]{display:none!important}
#admin{padding:0}
.login{max-width:520px;margin:10vh auto;padding:24px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 16px;background:var(--card);border-right:1px solid var(--line)}
.nav{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-left:4px solid transparent;border-radius:10px;background:none;color:var(--ink);font-size:16px;cursor:pointer}
.nav:hover{background:var(--bg)}.nav.on{background:var(--bg);border-left-color:var(--in);font-weight:700}
.side .so{margin-top:auto}
.main{padding:28px 32px;max-width:1040px;width:100%}.main h2{margin:0 0 14px;font-size:24px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.side .brand{margin:0 12px 0 0}.side .so{margin:0 0 0 auto}.nav{width:auto}.main{padding:18px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.p{background:var(--in);color:#fff;border-color:var(--in)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
td img{width:56px;height:42px;object-fit:cover;border-radius:6px}
.tag{font-weight:600}.tag.in{color:var(--in)}.tag.out{color:var(--out)}
.wrap{overflow-x:auto}
dialog{width:min(92vw,440px);border:0;border-radius:20px;padding:26px;background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(8,20,16,.4)}
dialog[open]{animation:pop .16s ease-out}
dialog::backdrop{background:rgba(8,20,16,.55);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
dialog h3{margin:0 0 6px;font-size:21px;line-height:1.25}dialog p{margin:0 0 16px;color:var(--mut)}
dialog input{width:100%;font-size:17px;padding:12px 14px}dialog input.err{border-color:var(--bad);outline:2px solid var(--bad)}
.mb{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
</style>
</head>
<body>
<div id="kiosk" hidden>
  <div>
    <div id="brandK"></div>
    <div class="clock" id="clock"></div><div class="date" id="date"></div>
    <video id="cam" playsinline muted></video>
    <div class="hint" id="hint">Enter your 5-digit PIN, then press Time In or Time Out. Your photo is taken as proof.</div>
  </div>
  <div class="pad"><div class="dots" id="dots"></div><div class="keys" id="keys"></div><div class="io" id="io"><button data-io="in" class="in">Time In</button><button data-io="out" class="out">Time Out</button></div></div>
  <div id="msg"><div><h1 id="mh"></h1><p id="mp"></p></div></div>
</div>

<div id="admin" hidden></div>
<dialog id="modal"><h3 id="mt"></h3><p id="mm"></p><input id="mi" autocomplete="off"><div class="mb"><button class="btn" id="mc">Cancel</button><button class="btn p" id="mo">OK</button></div></dialog>

/* ---------- Kiosk ---------- */
let pin = '', busy = false;
function dots() { $('dots').innerHTML = Array.from({length: 5}, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); }
function tick() { const n = new Date(); $('clock').textContent = fmt(n, {hour:'numeric', minute:'2-digit', second:'2-digit'}); $('date').textContent = fmt(n, {weekday:'long', month:'long', day:'numeric'}); }
function show(cls, h, p) { $('msg').className = 'show ' + cls; $('mh').textContent = h; $('mp').textContent = p; }
function frame(w) { const v = $('cam'), c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * v.videoHeight / v.videoWidth); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c; }

async function submit(code, kind) {
  if (busy) return;
  if (code.length !== 5) { show('bad', 'PIN needed', 'Enter your 5-digit PIN, then press Time In or Time Out.'); setTimeout(() => { $('msg').className = ''; }, 2000); return; }
  busy = true;
  const hint = $('hint'), idle = hint.textContent;
  try {
    hint.className = 'hint snap';
    for (let i = 3; i > 0; i--) { hint.textContent = 'Look at the camera... ' + i; await new Promise(r => setTimeout(r, 800)); }
    const blob = await new Promise(r => frame(320).toBlob(r, 'image/jpeg', .6));
    hint.className = 'hint'; hint.textContent = 'Saving...';
    const path = `${new Date().toISOString().slice(0, 10)}/${crypto.randomUUID()}.jpg`;
    const up = await db.storage.from('selfies').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const { data, error } = await db.rpc('punch', { p_code: code, p_kind: kind, p_photo: path });
    if (error) throw error;
    show(data.kind, data.kind === 'in' ? 'Time in recorded' : 'Time out recorded', `${data.name} · ${fmt(data.at, {hour:'numeric', minute:'2-digit'})}`);
  } catch (e) { show('bad', 'Not recorded', e.message || 'Check the connection and try again.'); }
  hint.className = 'hint'; hint.textContent = idle;
  pin = ''; dots();
  setTimeout(() => { $('msg').className = ''; busy = false; }, 3500);
}

async function startKiosk() {
  $('kiosk').hidden = false; $('brandK').innerHTML = brand(); dots(); tick(); setInterval(tick, 1000);
  $('keys').innerHTML = [1,2,3,4,5,6,7,8,9,'Clear',0,'Back'].map(k => `<button data-k="${k}">${k === 'Back' ? '\u232b' : k}</button>`).join('');
  $('keys').onclick = e => {
    const k = e.target.dataset.k; if (k === undefined || busy) return;
    if (k === 'Clear') pin = ''; else if (k === 'Back') pin = pin.slice(0, -1); else if (pin.length < 5) pin += k;
    dots();
  };
  $('io').onclick = e => { const k = e.target.dataset.io; if (k) submit(pin, k); };
  try {
    const v = $('cam');
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
    await v.play();
  } catch (e) { show('bad', 'Camera blocked', 'Allow camera access for this site in Safari settings, then reload.'); }
}

/* ---------- Admin (open this page with #admin) ---------- */
let rows = [];
async function startAdmin() {
  $('admin').hidden = false;
  const { data } = await db.auth.getSession();
  data.session ? adminHome() : adminLogin();
}
function adminLogin(msg = '') {
  $('admin').innerHTML = `<div class="login">${brand()}<h2>Admin sign in</h2><div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn p" id="si">Sign in</button></div><p>${esc(msg)}</p></div>`;
  $('si').onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $('em').value, password: $('pw').value });
    error ? adminLogin(error.message) : adminHome();
  };
}
async function adminHome() {
  const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  $('admin').innerHTML = `<div class="shell">
  <aside class="side">${brand()}
    <button class="nav on" data-v="logs">Employee logs</button>
    <button class="nav" data-v="emps">Employee management</button>
    <button class="nav" data-v="hist">History</button>
    <button class="btn so" id="so">Sign out</button>
  </aside>
  <main class="main">
    <section id="v-logs"><h2>Employee logs</h2>
      <div class="row"><input type="date" id="d1" value="${today}"><input type="date" id="d2" value="${today}"><button class="btn p" id="ld">Load</button><button class="btn" id="csv">Export CSV</button></div>
      <div class="wrap"><table><thead><tr><th>Time</th><th>Employee</th><th>Punch</th><th>Method</th><th>Photo</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </section>
    <section id="v-emps" hidden><h2>Employee management</h2>
      <div class="row"><input id="nn" placeholder="Full name"><input id="np" inputmode="numeric" maxlength="5" placeholder="PIN (5 digits)"><button class="btn p" id="ad">Add employee</button></div>
      <div class="wrap"><table><thead><tr><th>Name</th><th>PIN</th><th>Status</th><th></th></tr></thead><tbody id="eb"></tbody></table></div>
    </section>
    <section id="v-hist" hidden><h2>History</h2>
      <div class="wrap"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody id="ab"></tbody></table></div>
    </section>
  </main></div>`;
  document.querySelector('.side').onclick = e => {
    const v = e.target.dataset.v; if (!v) return;
    ['logs', 'emps', 'hist'].forEach(k => $('v-' + k).hidden = k !== v);
    document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.v === v));
    scrollTo(0, 0);
  };
  $('so').onclick = async () => { await db.auth.signOut(); adminLogin(); };
  $('ld').onclick = loadPunches; $('csv').onclick = exportCsv; $('ad').onclick = addEmp;
  $('tb').onclick = e => { const id = e.target.dataset.del; if (id) delPunch(id); };
  $('eb').onclick = e => {
    const t = e.target, d = t.dataset;
    if (d.pin) { t.textContent = t.textContent === 'Show' ? d.pin : 'Show'; return; }
    if (d.chg) return chgPin(d.chg, d.name);
    if (d.eid) delEmp(d.eid, d.name);
  };
  loadPunches(); loadEmps(); loadAudit();
}
async function loadPunches() {
  const a = new Date(`${$('d1').value}T00:00:00+08:00`), b = new Date(`${$('d2').value}T00:00:00+08:00`); b.setDate(b.getDate() + 1);
  const { data, error } = await db.from('punches').select('*, employees(name)').gte('punched_at', a.toISOString()).lt('punched_at', b.toISOString()).order('punched_at');
  if (error) { $('tb').innerHTML = `<tr><td colspan="6">${esc(error.message)}</td></tr>`; return; }
  rows = data;
  const paths = data.map(r => r.photo_path).filter(Boolean);
  const urls = {};
  if (paths.length) { const s = await db.storage.from('selfies').createSignedUrls(paths, 3600); (s.data || []).forEach(x => urls[x.path] = x.signedUrl); }
  $('tb').innerHTML = data.map(r => `<tr><td>${fmt(r.punched_at, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</td><td>${esc(r.employees.name)}</td><td class="tag ${r.kind}">${r.kind === 'in' ? 'Time in' : 'Time out'}</td><td>${r.method.toUpperCase()}</td><td>${urls[r.photo_path] ? `<img src="${urls[r.photo_path]}" alt="Selfie">` : ''}</td><td><button class="btn" data-del="${r.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="6">No punches in this range.</td></tr>';
}
function exportCsv() {
  const lines = ['Date,Time,Employee,Punch,Method', ...rows.map(r => [fmt(r.punched_at, {year:'numeric', month:'2-digit', day:'2-digit'}), fmt(r.punched_at, {hour:'2-digit', minute:'2-digit', hour12:false}), `"${r.employees.name}"`, r.kind, r.method].join(','))];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'attendance.csv'; a.click();
}
async function loadEmps() {
  const { data } = await db.from('employees').select('id,name,active,pin_plain').order('name');
  $('eb').innerHTML = (data || []).map(e => `<tr><td>${esc(e.name)}</td><td>${e.pin_plain ? `<button class="btn" data-pin="${e.pin_plain}">Show</button>` : 'Not set'}</td><td>${e.active ? 'Active' : 'Inactive'}</td><td><button class="btn" data-chg="${e.id}" data-name="${esc(e.name)}">Change PIN</button> <button class="btn" data-eid="${e.id}" data-name="${esc(e.name)}">Delete</button></td></tr>`).join('');
}
async function addEmp() {
  const { error } = await db.rpc('admin_add_employee', { p_name: $('nn').value.trim(), p_pin: $('np').value });
  if (error) return say('Could not add employee', error.message);
  $('nn').value = $('np').value = ''; loadEmps(); loadAudit();
}

function modal({ title, message = '', input = null, ok = 'OK', danger = false, cancel = true }) {
  return new Promise(res => {
    const d = $('modal'), i = $('mi'), o = $('mo');
    $('mt').textContent = title; $('mm').textContent = message;
    i.hidden = !input; i.value = ''; i.classList.remove('err');
    if (input) { i.placeholder = input.placeholder || ''; i.maxLength = input.max || 200; i.inputMode = input.numeric ? 'numeric' : 'text'; }
    o.textContent = ok; o.className = 'btn ' + (danger ? 'danger' : 'p'); $('mc').hidden = !cancel;
    const done = v => { d.close(); res(v); };
    i.oninput = () => i.classList.remove('err');
    i.onkeydown = e => { if (e.key === 'Enter') o.click(); };
    o.onclick = () => { if (input && !i.value.trim()) { i.classList.add('err'); i.focus(); return; } done(input ? i.value.trim() : true); };
    $('mc').onclick = () => done(null);
    d.oncancel = e => { e.preventDefault(); done(null); };
    d.showModal(); if (input) i.focus();
  });
}
const say = (title, message) => modal({ title, message, cancel: false });
async function chgPin(id, name) {
  const pin = await modal({ title: `New PIN for ${name}`, message: 'Enter a 5-digit PIN that no one else uses.', input: { placeholder: '5-digit PIN', max: 5, numeric: true }, ok: 'Save PIN' });
  if (!pin) return;
  const { error } = await db.rpc('admin_change_pin', { p_id: id, p_pin: pin });
  if (error) return say('Could not change PIN', error.message);
  loadEmps(); loadAudit();
}
async function removePhotos(paths) { if (paths && paths.length) await db.storage.from('selfies').remove(paths); }
async function delPunch(id) {
  const reason = await modal({ title: 'Delete this log permanently?', message: 'This cannot be undone. A record of the deletion, with your reason, is saved in History.', input: { placeholder: 'Reason for deleting (required)' }, ok: 'Delete log', danger: true });
  if (!reason) return;
  const { data, error } = await db.rpc('admin_delete_punches', { p_ids: [id], p_reason: reason });
  if (error) return say('Could not delete', error.message);
  await removePhotos(data); loadPunches(); loadAudit();
}
async function delEmp(id, name) {
  const reason = await modal({ title: `Delete ${name}?`, message: 'This permanently deletes the employee and all of their time logs. It cannot be undone. A record with your reason is saved in History.', input: { placeholder: 'Reason for deleting (required)' }, ok: 'Delete employee', danger: true });
  if (!reason) return;
  const { data, error } = await db.rpc('admin_delete_employee', { p_id: id, p_reason: reason });
  if (error) return say('Could not delete', error.message);
  await removePhotos(data); loadEmps(); loadPunches(); loadAudit();
}
function auditText(a, d) {
  const w = d.reason ? ` | Reason: ${d.reason}` : '';
  if (a === 'delete_punch') return `${d.employee}: ${d.kind === 'in' ? 'Time in' : 'Time out'} on ${fmt(d.punched_at, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}${w}`;
  if (a === 'delete_employee') return `${d.employee} and ${d.logs_deleted} log(s)${w}`;
  return d.employee || '';
}
const actions = { delete_punch: 'Deleted log', delete_employee: 'Deleted employee', add_employee: 'Added employee', change_pin: 'Changed PIN' };
async function loadAudit() {
  const { data, error } = await db.from('audit_log').select('*').order('at', { ascending: false }).limit(100);
  if (error) { $('ab').innerHTML = `<tr><td colspan="4">${esc(error.message)}</td></tr>`; return; }
  $('ab').innerHTML = data.map(a => `<tr><td>${fmt(a.at, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</td><td>${esc(a.admin_email || '')}</td><td>${actions[a.action] || esc(a.action)}</td><td>${esc(auditText(a.action, a.details))}</td></tr>`).join('') || '<tr><td colspan="4">No history yet.</td></tr>';
}

location.hash === '#admin' ? startAdmin() : startKiosk();
addEventListener('hashchange', () => location.reload());
</script>
